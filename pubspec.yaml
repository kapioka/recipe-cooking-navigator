name: recipe_cooking_navigator
description: "Android-first cooking navigation app for structured ChatGPT recipes."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.2

dependencies:
  siwc_client:
    path: packages/siwc_client
  collection: ^1.19.1
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  json_schema: ^5.2.2
  path_provider: ^2.1.6
  unorm_dart: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - ai/workflows/generate.md
    - ai/workflows/improve.md
    - docs/chatgpt-integration.md
    - examples/recipe-v2-split-example.json
    - schemas/recipe-v2.schema.json
    - schemas/feedback-v2.schema.json
    - schemas/feedback-evidence-v1.schema.json
    - schemas/cooking-profile-v1.schema.json
    - schemas/cooking-profile-v1.1.schema.json
    - schemas/preference-candidates-v1.schema.json
    - schemas/preference-operation-v1.schema.json
    - schemas/profile-history-v1.schema.json
